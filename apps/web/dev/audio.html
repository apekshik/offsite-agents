<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offsite · audio (dev)</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; min-height: 100%; background: #05070b; color: #eef3f7; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
    main { display: grid; grid-template-columns: minmax(280px, 340px) 1fr; gap: 18px; padding: 16px; max-width: 1200px; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
    h1 { margin: 0 0 8px; font-size: 14px; letter-spacing: 0.08em; color: #8fd3ff; }
    h2 { margin: 16px 0 6px; font-size: 12px; letter-spacing: 0.08em; color: #8fd3ff; text-transform: uppercase; }
    button { background: #12263c; color: #eef3f7; border: 1px solid #2f5d8a; border-radius: 5px; padding: 4px 9px; font: inherit; cursor: pointer; margin: 0 4px 4px 0; }
    button:hover { background: #1b3a5c; }
    button.on { background: #2f5d8a; }
    label { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    input[type=range] { flex: 1; }
    svg { background: #0a1520; border: 1px solid #1f3a55; border-radius: 6px; cursor: crosshair; display: block; }
    .muted { color: #8aa0b5; }
    .files { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 6px 14px; }
    .files div { display: flex; flex-direction: column; }
    audio { width: 100%; height: 28px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./audio.tsx"></script>
</body>
</html>
