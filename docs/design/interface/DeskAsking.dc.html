<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desk monitor: waiting on the captain</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,300..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.ph{font-family:"Saira",system-ui,sans-serif;color:#eef3f7;font-variant-numeric:tabular-nums}
.lab{font-weight:500;letter-spacing:0;text-transform:none}
.disp{font-weight:600;letter-spacing:-.01em}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.face{position:relative;display:inline-block;width:44px;height:44px;border-radius:10px;flex:none;overflow:hidden}
.face i{position:absolute;left:0;right:0;top:0;height:13px}
.face::after{content:"";position:absolute;left:12px;top:24px;width:6px;height:6px;border-radius:50%;background:#1a1410;box-shadow:14px 0 0 #1a1410}
.k{color:#c792ea}.s{color:#c3e88d}.f{color:#82aaff}.c{color:#56657a}.t{color:#ffcb6b}
</style>
</helmet>
<div class="ph" style="width:960px;height:600px;box-sizing:border-box;background:#070a10;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;background:#0d121a;border-bottom:1px solid #1a212c">
    <span class="mono" style="font-size:15px;padding:12px 18px;background:#070a10;color:#9aa8b6;border-right:1px solid #1a212c">Terminal</span>
  </div>
  <div class="mono" style="flex:1;padding:22px 26px;font-size:19px;line-height:1.6;color:#56657a;white-space:pre;overflow:hidden">$ pnpm test settings
  ✓ reads the saved mode (12 ms)
  ✓ toggles to dark (8 ms)

<span style="color:#ffc861">? Allow: rm -rf node_modules/.cache</span>
  <span style="color:#c7d0d9">Waiting for the captain…</span></div>
  <div style="display:flex;align-items:center;gap:18px;padding:12px 22px;background:#100d06;border-top:2px solid #ffc861">
    <span class="face" style="background:#f0c8a8;width:36px;height:36px;border-radius:8px"><i style="background:#e8c46a"></i></span>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;align-items:baseline;gap:14px"><span class="disp" style="font-size:22px;color:#ffc861">Needs you</span><span style="font-size:20px;color:#c7d0d9">Tests for both</span></div>
      <span style="font-size:16px;color:#9aa8b6">Went to find the captain</span>
    </div>
    <span class="disp" style="font-size:20px">Otis</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
