<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone closed: the cover screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,300..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4fe3ff}a:hover{color:#9ff0ff}
.ph{font-family:"Saira",system-ui,sans-serif;color:#eef3f7;font-variant-numeric:tabular-nums}
.br{--bc:rgba(238,243,247,.5);--bg:rgba(255,255,255,.03);background:var(--bg);border:1px solid color-mix(in srgb,var(--bc) 32%,transparent);border-radius:8px}
.lab{font-weight:500;font-size:12px;letter-spacing:0;text-transform:none}
.disp{font-weight:650;letter-spacing:-.01em}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.face{position:relative;display:inline-block;width:22px;height:22px;border-radius:5px;flex:none;overflow:hidden}
.face i{position:absolute;left:0;right:0;top:0;height:7px}
.face::after{content:"";position:absolute;left:6px;top:12px;width:3px;height:3px;border-radius:50%;background:#1a1410;box-shadow:7px 0 0 #1a1410}
button{font:inherit;color:#eef3f7;border:0;cursor:pointer}
</style>
</helmet>
<div class="ph" style="width:360px;height:800px;box-sizing:border-box;padding:20px;background:#0c1016;display:flex;align-items:center;justify-content:center">
  <div style="width:320px;height:760px;box-sizing:border-box;border-radius:34px;background:#05070b;border:7px solid #1c212a;box-shadow:0 0 0 1px #2c323d,0 30px 80px rgba(0,0,0,.55);padding:26px 20px 22px;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="lab" style="color:#4fe3ff">Sea Legs</span>
      <span style="display:flex;align-items:center;gap:6px;font-size:12px;color:#9aa8b6"><span style="width:7px;height:7px;border-radius:50%;background:#6dffa8"></span>online</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:2px">
      <span class="disp" style="font-size:52px;line-height:1">18:24</span>
      <span style="font-size:13px;color:#9aa8b6">Golden hour · 3 at work · 1 off duty</span>
    </div>

    <div class="br" style="--bc:#ffc861;--bg:rgba(255,200,97,.1);padding:10px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:9px"><span class="face" style="background:#f0c8a8"><i style="background:#e8c46a"></i></span><span class="lab" style="color:#ffc861">Otis needs you</span></div>
      <span class="mono" style="font-size:13px;line-height:1.4">Run: rm -rf node_modules/.cache</span>
      <span style="font-size:12px;color:#9aa8b6">Tests for both · Add a settings page</span>
      <div style="display:flex;gap:8px">
        <button style="flex:1;padding:8px 0;background:#ffc861;color:#241a05;font-weight:700;font-size:14px">Allow</button>
        <button style="flex:1;padding:8px 0;background:rgba(255,200,97,.16);color:#ffc861;font-weight:600;font-size:14px">Deny</button>
      </div>
    </div>

    <div class="br" style="--bc:rgba(238,243,247,.35);padding:10px;display:flex;flex-direction:column;gap:7px">
      <div style="display:flex;align-items:center;gap:9px"><span class="face" style="background:#f1c9a5"><i style="background:#c8643b"></i></span><span class="lab" style="color:#6dffa8">Wren landed</span><span style="margin-left:auto;font-size:11px;color:#9aa8b6">2 min</span></div>
      <span style="font-size:14px;line-height:1.35">Shared types and interfaces</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px">
      <span class="lab" style="color:#9aa8b6">Crew</span>
      <div style="display:flex;align-items:center;gap:10px;font-size:13px"><span class="face" style="background:#e2a77f"><i style="background:#5a3a22"></i></span><span style="flex:1">Marlo</span><span class="lab" style="color:#4fe3ff">Editing</span></div>
      <div style="display:flex;align-items:center;gap:10px;font-size:13px"><span class="face" style="background:#f0c8a8"><i style="background:#e8c46a"></i></span><span style="flex:1">Otis</span><span class="lab" style="color:#ffc861">Needs you</span></div>
      <div style="display:flex;align-items:center;gap:10px;font-size:13px"><span class="face" style="background:#d9a07a"><i style="background:#1e1410"></i></span><span style="flex:1">Coral</span><span class="lab" style="color:#4fe3ff">Reading</span></div>
      <div style="display:flex;align-items:center;gap:10px;font-size:13px"><span class="face" style="background:#f1c9a5"><i style="background:#c8643b"></i></span><span style="flex:1">Wren</span><span class="lab" style="color:#9aa8b6">Off duty</span></div>
    </div>

    <div style="margin-top:auto;display:flex;justify-content:center;align-items:center;gap:8px;color:#9aa8b6;font-size:12px">
      <span class="lab" style="padding:4px 7px;border:1px solid rgba(238,243,247,.3);color:#eef3f7">F</span> unfold
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
